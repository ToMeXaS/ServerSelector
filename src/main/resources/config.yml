# Title shown above the carousel.
title: "CHOOSE YOUR REALM"

# How far the cursor can move from the centre, in plane units. Set these to the edge of the screen:
# y = 2 * tan(FOV / 2), x = y * width / height. FOV 90 on 16:9 gives 3.55 x 2.0; FOV 70 gives 2.49 x 1.4.
cursor-bounds:
  x: 3.55
  y: 2.0

# Servers shown in the selector, in this order. Keys must match the proxy's server names.
# icon is a glyph id from nexo/glyphs/selector.yml: selector_icon_sword, _pickaxe, _axe, _bow,
# _hammer, _wand, _bomb, _torch or _star.
servers:
  survival:
    display-name: "Survival"
    icon: selector_icon_sword
    description:
      - "Classic survival with land"
      - "claims, jobs and an economy."
  creative:
    display-name: "Creative"
    icon: selector_icon_pickaxe
    description:
      - "Big plots, WorldEdit and"
      - "weekly build contests."
